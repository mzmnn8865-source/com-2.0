<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قاب جادویی</title>

<style>
:root{--bg:#000;--surf:#16161d;--ink:#f2f2f7;--mute:#a6a6b8;--line:#ffffff24;--ind:#8f98f7;--onind:#0b0b12;--amb:#ffb454;--ambt:#ffb454;--onamb:#16161d;

:root[data-theme="light"]{--bg:#fff;--surf:#f1f1f5;--ink:#16161d;--mute:#585868;--line:#16161d24;--ind:#4650c8;--onind:#fff;--ambt:#a85a00}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.9 Vazirmatn,Tahoma,sans-serif;text-align:right}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;text-align:right;cursor:pointer}
button:focus-visible{outline:3px solid var(--ind);outline-offset:2px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
header{display:flex;justify-content:space-between;align-items:flex-start;padding:24px 16px 16px}
h1{font:900 32px/1.3 Vazirmatn,Tahoma,sans-serif;margin:0}
header p{margin:0;color:var(--mute);font-size:14px}
.ib{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center;padding:0;flex:none}
#stage{position:relative;aspect-ratio:4/3;background:#000;border-block:1px solid var(--line);touch-action:none}
canvas{width:100%;height:100%;display:block}
#go{position:absolute;inset:0;display:none;place-items:center;background:#000c;padding:24px}

.panel{display:none;padding:32px 16px 48px;flex-direction:column;gap:32px}.panel.on{display:flex}
h2{font:700 15px/1.6 Vazirmatn,Tahoma,sans-serif;margin:0 0 16px}
.sub{color:var(--mute);font-size:14px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{height:48px;border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:0 16px;font-weight:600}
.tile[aria-pressed=true]{background:var(--ind);border-color:var(--ind);color:var(--onind)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:24px 16px}
.card h2{margin-bottom:8px}.card p{margin:0;color:var(--mute);font-size:14px}
.lab{display:flex;justify-content:flex-start;gap:16px;color:var(--mute);font-size:14px;margin-bottom:8px}
input[type=range]{width:100%;accent-color:var(--ind);height:32px;margin:0}
.tg{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.tg:first-of-type{border-top:0;padding-top:0}.tg small{display:block;color:var(--mute);font-size:13px;line-height:1.7}
.sw{flex:none;width:48px;height:28px;border-radius:99px;background:var(--surf);border:1px solid var(--line);position:relative;padding:0}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--mute);transition:transform .2s}
.sw[aria-pressed=true]{background:var(--ind);border-color:var(--ind)}.sw[aria-pressed=true]::after{background:var(--onind);transform:translateX(-20px)}
#modal{position:fixed;inset:0;background:#000e;display:none;flex-direction:column;justify-content:center;gap:16px;padding:24px;z-index:9;color:#fff}
#modal img{max-width:100%;max-height:68%;border-radius:12px;align-self:flex-start}#modal p{margin:0}
</style>
</head>

</div>

 if(f===2){const o=W/220*(1+K*6);ctx.globalCompositeOperation='lighter';['#f00','#0f0','#00f'].forEach((c,k)=>{tx.globalCompositeOperation='source-over';tx.clearRect(b.x,b.y,b.w,b.h);tx.drawImage(cv,b.x,b.y,b.w,b.h,b.x,b.y,b.w,b.h);tx.globalCompositeOperation='multiply';tx.fillStyle=c;tx.fillRect(b.x,b.y,b.w,b.h);ctx.drawImage(tmp,b.x,b.y,b.w,b.h,b.x+(k-1)*o,b.y,b.w,b.h)});ctx.globalCompositeOperation='source-over';return}
 const im=sample(),d=im.data;
 if(f===0)dots(d,b);
 else if(f===1)px2(im,(d,i)=>{const l=lum(d,i);return l<.28?[20,10,30]:l<.55?[255,45,125]:[255,150,20]});
 else if(f===3)px2(im,(d,i)=>ramp([[20,30,200],[0,170,255],[40,230,120],[255,230,40],[255,120,20]],lum(d,i)));
 else if(f===4)edges(im,(d,o,e)=>{d[o]=12+e*255;d[o+1]=8+e*70;d[o+2]=30+e*230});
 else if(f===9)edges(im,(d,o,e)=>{if(e>.3){d[o]=d[o+1]=d[o+2]=0}else{d[o]=d[o]>>6<<6;d[o+1]=d[o+1]>>6<<6;d[o+2]=d[o+2]>>6<<6}});
 else if(f===10){ctx.imageSmoothingEnabled=true;ctx.drawImage(sc,0,0,W,H);ctx.fillStyle='rgba(255,255,255,'+(.2+K*.4)+')';ctx.fillRect(b.x,b.y,b.w,b.h)}
 else if(f===11)px2(im,(d,i)=>{const l=cl((lum(d,i)-.5)*(1.3+K)*255+128,0,255);return[l,l,l]});
 else{const n=Math.round(10+(1-K)*50);pc.width=n;pc.height=Math.max(2,Math.round(n*H/W));px.drawImage(sc,0,0,n,pc.height);ctx.imageSmoothingEnabled=false;ctx.drawImage(pc,0,0,W,H);ctx.imageSmoothingEnabled=true}}
function portal(t,dt){if(hs.length<2)return;const a=hs[0],b=hs[1];qd[0]=a.p[16];qd[1]=a.p[17];qd[2]=b.p[16];qd[3]=b.p[17];qd[4]=b.p[8];qd[5]=b.p[9];qd[6]=a.p[8];qd[7]=a.p[9];
 let ar=0,x0=W,y0=H,x1=0,y1=0;for(let i=0;i<4;i++){const j=(i+1)&3;ar+=qd[2*i]*qd[2*j+1]-qd[2*j]*qd[2*i+1];x0=Math.min(x0,qd[2*i]);y0=Math.min(y0,qd[2*i+1]);x1=Math.max(x1,qd[2*i]);y1=Math.max(y1,qd[2*i+1])}ar=Math.abs(ar)/2/(W*H);
 if(ar<.008)coll=true;else if(coll&&ar>.03){coll=false;if(t-lastSw>700){lastSw=t;setPf(S.pf+1);snd('whoosh');snd('click')}}
 if(ar<.002)return;x0=Math.max(0,x0|0);y0=Math.max(0,y0|0);x1=Math.min(W,Math.ceil(x1));y1=Math.min(H,Math.ceil(y1));
 const pa=()=>{ctx.beginPath();ctx.moveTo(qd[0],qd[1]);for(let i=1;i<4;i++)ctx.lineTo(qd[2*i],qd[2*i+1]);ctx.closePath()};
 if(x1>x0&&y1>y0){ctx.save();pa();ctx.clip();renderFilter({x:x0,y:y0,w:x1-x0,h:y1-y0});const fl=1-(performance.now()-pfT)/280;if(fl>0){ctx.fillStyle='rgba(255,255,255,'+fl*.8+')';ctx.fillRect(x0,y0,x1-x0,y1-y0)}ctx.restore()}
 st('#fff',2);for(let k=0;k<2;k++){ctx.beginPath();for(let i=0;i<4;i++){const j=(i+1)&3;ctx.moveTo(qd[2*i]+jr(i*3+k)*2.5,qd[2*i+1]+jr(i*3+k+1)*2.5);ctx.lineTo(qd[2*j]+jr(j*3+k+2)*2.5,qd[2*j+1]+jr(j*3+k+3)*2.5)}ctx.stroke()}
 st('#ffb454',3);ctx.beginPath();for(let i=0;i<4;i++){const px_=qd[2*i],py_=qd[2*i+1],nx=qd[2*((i+1)&3)]-px_,ny=qd[2*((i+1)&3)+1]-py_,L=Math.hypot(nx,ny)||1,mx2=qd[2*((i+3)&3)]-px_,my2=qd[2*((i+3)&3)+1]-py_,L2=Math.hypot(mx2,my2)||1;ctx.moveTo(px_+nx/L*16,py_+ny/L*16);ctx.lineTo(px_,py_);ctx.lineTo(px_+mx2/L2*16,py_+my2/L2*16)}ctx.stroke();
 if(x1-x0>110){ctx.font='700 13px Vazirmatn,Tahoma,sans-serif';ctx.direction='rtl';ctx.textAlign='right';ctx.lineWidth=4;ctx.strokeStyle='#000';ctx.strokeText(PF[S.pf],x1-8,y0+20);ctx.fillStyle='#fff';ctx.fillText(PF[S.pf],x1-8,y0+20)}}
/* ---------- منوی داخل دوربین (انتخاب با انگشت) ---------- */
const cur={on:false,x:0,y:0,click:false};let menuOpen=false,mHov=-1,mT=0,btnT=0,mIdle=0,BTN={x:0,y:0,w:0,h:0};
const mlay=i=>{const n=FX.length+1,cols=W>=H?4:3,rows=Math.ceil(n/cols),g=8,m0=12,top=52,tw=(W-2*m0-(cols-1)*g)/cols,th=Math.min(120,(H-top-m0-(rows-1)*g)/rows),c=i%cols,r=(i/cols)|0;return[W-m0-tw-c*(tw+g),top+r*(th+g),tw,th]};
function icon(k,x,y,r){ctx.beginPath();switch(k){
 case'spear':ctx.moveTo(x-r,y+r);ctx.lineTo(x+r,y-r);ctx.moveTo(x+r,y-r);ctx.lineTo(x+r*.2,y-r);ctx.moveTo(x+r,y-r);ctx.lineTo(x+r,y-r*.2);break;
 case'purple':ctx.arc(x-r*.35,y,r*.6,0,TAU);ctx.moveTo(x+r*.95,y);ctx.arc(x+r*.35,y,r*.6,0,TAU);break;
 case'bolt':ctx.moveTo(x+r*.3,y-r);ctx.lineTo(x-r*.4,y+r*.1);ctx.lineTo(x+r*.2,y+r*.1);ctx.lineTo(x-r*.3,y+r);break;
 case'orb':ctx.arc(x,y,r*.45,0,TAU);ctx.moveTo(x+r,y);ctx.ellipse(x,y,r,r*.35,.5,0,TAU);break;
 case'fire':ctx.moveTo(x,y-r);ctx.quadraticCurveTo(x+r*1.1,y,x+r*.5,y+r*.6);ctx.arc(x,y+r*.3,r*.5,0,Math.PI);ctx.quadraticCurveTo(x-r*1.1,y,x,y-r);break;
 case'tornado':for(let i=0;i<4;i++){ctx.moveTo(x+r*(.3+i*.2),y-r+i*r*.6);ctx.ellipse(x,y-r+i*r*.6,r*(.3+i*.2),r*.15,0,0,TAU)}break;
 case'saber':ctx.moveTo(x-r,y+r);ctx.lineTo(x-r*.6,y+r*.6);ctx.moveTo(x-r*.5,y+r*.5);ctx.lineTo(x+r,y-r);break;
 case'ice':for(let i=0;i<3;i++){const a=i*1.047;ctx.moveTo(x-Math.cos(a)*r,y-Math.sin(a)*r);ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}break;
 case'spark':star(x,y,r);break;
 case'slash':ctx.arc(x+r*.5,y+r*.5,r*1.3,3.5,5.2);break;
 case'ink':ctx.moveTo(x-r,y+r*.3);ctx.bezierCurveTo(x-r*.5,y-r*1.2,x,y+r*1.2,x+r,y-r*.3);break;
 case'mandala':ctx.arc(x,y,r,0,TAU);for(let i=0;i<3;i++){const a=-1.57+i*2.094;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath();break;
 case'portal':ctx.rect(x-r,y-r*.7,r*2,r*1.4);break;
 default:ctx.moveTo(x-r,y-r);ctx.lineTo(x+r,y+r);ctx.moveTo(x+r,y-r);ctx.lineTo(x-r,y+r)}ctx.stroke()}
function pick(i){if(i>=FX.length){closeMenu();return}setFx(FX[i][0]);snd('click');snd('chime',i);closeMenu()}
function openMenu(){menuOpen=true;mT=0;btnT=0;mIdle=0;snd('tick')}
function closeMenu(){menuOpen=false;mT=0;btnT=0}
function drawMenu(dt){ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(0,0,W,H);let hv=-1;
 if(cur.on)for(let i=0;i<=FX.length;i++){const[x,y,w,h]=mlay(i);if(cur.x>x&&cur.x<x+w&&cur.y>y&&cur.y<y+h){hv=i;break}}
 if(hv===mHov&&hv>=0)mT+=dt;else{if(hv!==mHov&&hv>=0)snd('tick');mHov=hv;mT=0}
 ctx.font='700 '+Math.round(Math.max(11,W/46))+'px Vazirmatn,Tahoma,sans-serif';ctx.direction='rtl';ctx.textAlign='right';
 for(let i=0;i<=FX.length;i++){const[x,y,w,h]=mlay(i),act=i<FX.length&&FX[i][0]===S.fx,hov=i===hv;
  ctx.fillStyle=hov?'rgba(255,180,84,.24)':act?'rgba(143,152,247,.3)':'rgba(255,255,255,.08)';rr(x,y,w,h,12);ctx.fill();
  st(hov?'#ffb454':act?'#8f98f7':'rgba(255,255,255,.45)',hov?2.4:1.4);rr(x+(hov?jr(i)*1.2:0),y+(hov?jr(i+1)*1.2:0),w,h,12);ctx.stroke();
  st(hov?'#ffb454':'#fff',2);icon(i<FX.length?FX[i][0]:'close',x+w-h*.32,y+h*.36,h*.2);ctx.fillStyle='#fff';ctx.fillText(i<FX.length?FX[i][1]:'بستن',x+w-10,y+h-12)}
 if(cur.on){st('#fff',2);ctx.beginPath();ctx.arc(cur.x,cur.y,10,0,TAU);ctx.stroke();if(mT>0){st('#ffb454',4);ctx.beginPath();ctx.arc(cur.x,cur.y,18,-1.57,-1.57+TAU*Math.min(1,mT/.8));ctx.stroke()}mIdle=0}else mIdle+=dt;
 if(hv>=0&&(mT>.8||cur.click)){pick(hv);hs.forEach(h=>h.pev=0)}else if(mIdle>6)closeMenu()}
function drawBtn(dt){const f=FX.find(x=>x[0]===S.fx)[1];ctx.font='700 12px Vazirmatn,Tahoma,sans-serif';ctx.direction='rtl';ctx.textAlign='right';const bw=ctx.measureText(f).width+56,bx=W-12-bw,by=12,bh=34;BTN={x:bx,y:by,w:bw,h:bh};
 ctx.fillStyle='rgba(0,0,0,.5)';rr(bx,by,bw,bh,17);ctx.fill();st('rgba(255,255,255,.6)',1.4);rr(bx,by,bw,bh,17);ctx.stroke();st('#fff',2);ctx.beginPath();for(let i=0;i<3;i++){ctx.moveTo(W-12-26,by+11+i*6);ctx.lineTo(W-12-12,by+11+i*6)}ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(f,W-12-34,by+22);
 if(cur.on&&cur.x>bx-12&&cur.x<bx+bw+12&&cur.y<by+bh+12){btnT+=dt;st('#ffb454',4);ctx.beginPath();ctx.arc(cur.x,cur.y,16,-1.57,-1.57+TAU*Math.min(1,btnT/.9));ctx.stroke();if(btnT>.9)openMenu()}else btnT=Math.max(0,btnT-dt*2)}
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
 if(menuOpen){for(let i=0;i<=FX.length;i++){const[a,b,w,h]=mlay(i);if(x>a&&x<a+w&&y>b&&y<b+h){pick(i);return}}closeMenu()}else if(x>BTN.x&&x<BTN.x+BTN.w&&y>BTN.y&&y<BTN.y+BTN.h)openMenu()});
/* ---------- هماهنگ‌کننده ---------- */
function runFx(dt,t){
 hs.length=0;for(const h of HP)if(h.on){feat(h,dt);hs.push(h)}
 cur.on=false;cur.click=false;for(const h of hs)if(h.ext[1]&&h.g!=='fist'&&!cur.on){cur.on=true;cur.x=h.p[16];cur.y=h.p[17];cur.click=!!h.pev}
 const m=S.fx,n=hs.length;shk=SHK>.3;if(shk){ctx.save();ctx.translate(jr(1)*SHK,jr(2)*SHK);SHK*=.85}
 if(!menuOpen){
  if(m==='portal')portal(t,dt);
  else if(m==='orb'){if(n===2)orb2(hs[0],hs[1],dt,t);else{OR.c=Math.max(0,OR.c-dt*2);OR.vx=OR.vy=0}}
  else{const two=n===2,pb=false,pf=two&&m==='fire';
   hs.forEach((h,i)=>{if(m==='purple')purple(h,dt);else if(m==='spear')spear(h,dt);else if(m==='bolt')bolt(h,dt);else if(m==='fire'){if(!(pf&&i))fire(h,dt,pf)}else if(m==='tornado')tornado(h,dt,t);else if(m==='saber')saber(h,dt,t);else if(m==='ice')ice(h,dt,t);else if(m==='spark')spark(h,dt,t);else if(m==='slash')slash(h,dt);else if(m==='ink')ink(h,dt);else if(m==='mandala')mandala(h,dt,t);h.pev=0;h.tev=0})}}
 drawInk(dt);drawSP(dt);drawPJ(dt);orbBeam(dt,t);drawBU(dt);drawSLS(dt);drawRK(dt);drawP(dt);drawFlash();if(shk)ctx.restore();
 if(menuOpen)drawMenu(dt);else drawBtn(dt);applyL()}
/* ---------- حلقه‌ی اصلی ---------- */
function loop(t){requestAnimationFrame(loop);
 if(mode==='cam'){if(video.readyState<2||video.currentTime===lastT)return;lastT=video.currentTime}
 if(document.hidden)return;
 const raw=t-ft,dt=Math.min(.1,Math.max(.001,raw/1000));ft=t;fn++;bt=(t/66)|0;bt2=(t/40)|0;
 if(raw>0&&raw<500){const f=1000/raw;slow=f<22?slow+1:Math.max(0,slow-1);if(fn%20===0){fps=Math.round(f);paint()}if(slow>90&&!S.light){setTg('light',true);slow=0;say('حالت سبک خودش روشن شد تا لگ نکنه')}}
 if(mode==='cam')ctx.drawImage(video,0,0,W,H);else{const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#16161d');g.addColorStop(1,'#4650c8');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
 if(lm&&fn%stride===0){const t0=performance.now();tsH=Math.max(tsH+1,t|0);try{assign(lm.detectForVideo(video,tsH).landmarks,t)}catch(e){}const ms=performance.now()-t0;if(ms>30){if(++det>25&&stride<2){stride=2;det=0}}else det=Math.max(0,det-1)}
 runFx(dt,t);
 if(lm&&fn%12===0){const need=S.fx==='portal'||S.fx==='orb'?2:1,nm=FX.find(x=>x[0]===S.fx)[1],s=menuOpen?'انگشتت رو روی یه گزینه نگه دار':hs.length>=need?'آماده‌ای: '+nm:hs.length?'دست دومت رو هم بیار':noHand>150?'دستت پیدا نمی‌شه، نیم متر عقب‌تر برو و نور رو بیشتر کن':'دستت رو باز جلوی دوربین پشتی بگیر. برای باز کردن منو، انگشتت رو روی دکمه‌ی بالا نگه دار';if(s!==msg.split(' · ')[0]){msg=s;paint()}}}
async function startCam(){try{if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{exact:'environment'},width:{ideal:640},height:{ideal:480},frameRate:{ideal:30,max:30}}});
 video.srcObject=stream;await video.play();sizeAll(video.videoWidth||640,video.videoHeight||480);mode='cam';$('go').style.display='none';lastT=-1;return true
 }catch(e){$('gop').textContent=e&&e.name==='NotAllowedError'?'اجازه‌ی دوربین پشتی رو بده تا شروع کنیم.':'دوربین پشتی پیدا نشد. این برنامه فقط با دوربین پشتی کار می‌کنه.';$('go').style.display='grid';say('دوربین پشتی روشن نشد');return false}}
$('goBtn').onclick=boot;
async function boot(){ainit();say('دوربین پشتی داره روشن می‌شه…');if(!await startCam())return;if(lm)return;say('دارم ردیاب دست رو بارگذاری می‌کنم، بار اول چند ثانیه طول می‌کشه');
 try{await initHands();say('دستت رو باز جلوی دوربین پشتی بگیر')}catch(e){lm=null;say('ردیاب بارگذاری نشد. صفحه رو دوباره باز کن.')}}
